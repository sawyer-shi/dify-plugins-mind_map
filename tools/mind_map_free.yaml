identity:
  name: mind_map_free
  author: sawyer-shi
  label:
    en_US: Mind Map (Free Structure)
    zh_Hans: 脑图(自由结构)
description:
  human:
    en_US: Generate mind maps that automatically choose between Center and Horizontal layouts based on complexity
    zh_Hans: 根据内容复杂度自动选择中心或水平样式生成脑图
  llm: A smart tool that converts Markdown text into PNG mind maps, automatically selecting between Center Radial (for simple) and Horizontal (for complex) layouts.
parameters:
  - name: markdown_content
    type: string
    required: true
    label:
      en_US: Markdown Content
      zh_Hans: Markdown内容
    human_description:
      en_US: The Markdown text content to convert into a mind map
      zh_Hans: 要转换为脑图的Markdown文本内容
    llm_description: Markdown formatted text that will be parsed and converted into a free structure mind map
    form: llm
  - name: filename
    type: string
    required: false
    label:
      en_US: Filename
      zh_Hans: 文件名
    human_description:
      en_US: Optional filename for the output PNG file (without extension)
      zh_Hans: PNG输出文件的文件名（可选，无需扩展名）
    llm_description: Optional filename for the generated PNG mind map. If not provided, a timestamp will be used
    form: llm
  - name: download_md
    type: boolean
    required: false
    default: false
    label:
      en_US: Download MD File
      zh_Hans: 是否下载输出脑图md文件
    human_description:
      en_US: Whether to output the mind map MD file in addition to the PNG image
      zh_Hans: 除了正常输出脑图图片外，是否还输出脑图的md文件
    form: form
extra:
  python:
    source: tools/mind_map_free.py

