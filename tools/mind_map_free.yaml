identity:
  name: mind_map_free
  author: sawyer-shi
  label:
    en_US: Mind Map (Free Structure)
    zh_Hans: 脑图(自由结构)
description:
  human:
    en_US: Generate optimized free-structure radial mind maps that prevent overlaps
    zh_Hans: 生成防重叠、线条不交叉的自由结构（优化放射状）脑图
  llm: A powerful tool that converts Markdown text into beautiful PNG mind maps with an optimized free structure layout that prevents overlapping
parameters:
  - name: markdown_content
    type: string
    required: true
    label:
      en_US: Markdown Content
      zh_Hans: Markdown内容
    human_description:
      en_US: The Markdown text content to convert into a mind map
      zh_Hans: 要转换为脑图的Markdown文本内容
    llm_description: Markdown formatted text that will be parsed and converted into a free structure mind map
    form: llm
  - name: filename
    type: string
    required: false
    label:
      en_US: Filename
      zh_Hans: 文件名
    human_description:
      en_US: Optional filename for the output PNG file (without extension)
      zh_Hans: PNG输出文件的文件名（可选，无需扩展名）
    llm_description: Optional filename for the generated PNG mind map. If not provided, a timestamp will be used
    form: llm
extra:
  python:
    source: tools/mind_map_free.py

