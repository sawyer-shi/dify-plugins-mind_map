identity:
  name: mind_map_free_watermark
  author: sawyer-shi
  label:
    en_US: Mind Map (Smart Layout + Watermark)
    zh_Hans: 脑图(自由结构+水印)
description:
  human:
    en_US: Generate optimized mind maps from Markdown text with auto-layout and watermark
    zh_Hans: 智能识别内容复杂度，自动选择中心或左右结构生成脑图，并支持添加水印
  llm: A smart tool that automatically chooses between center and horizontal layouts for mind map generation based on content complexity, with watermark support
parameters:
  - name: markdown_content
    type: string
    required: true
    label:
      en_US: Markdown Content
      zh_Hans: Markdown内容
    human_description:
      en_US: The Markdown text content to convert into a mind map
      zh_Hans: 要转换为脑图的Markdown文本内容
    llm_description: Markdown formatted text that will be parsed and converted into a smart layout mind map
    form: llm
  - name: filename
    type: string
    required: false
    label:
      en_US: Filename
      zh_Hans: 文件名
    human_description:
      en_US: Optional filename for the output PNG file (without extension)
      zh_Hans: PNG输出文件的文件名（可选，无需扩展名）
    llm_description: Optional filename for the generated PNG mind map. If not provided, a timestamp will be used
    form: llm
  - name: watermark_text
    type: string
    required: true
    label:
      en_US: Watermark Text
      zh_Hans: 水印名称
    human_description:
      en_US: Text to display as watermark
      zh_Hans: 水印显示的文本内容
    llm_description: The text content for the watermark
    form: form
  - name: opacity
    type: number
    required: false
    default: 40
    min: 0
    max: 255
    label:
      en_US: Transparency
      zh_Hans: 透明度
    human_description:
      en_US: Watermark transparency (0-255), smaller is more transparent. Default 40.
      zh_Hans: 水印透明度 (0-255)，越小越透明，默认40
    form: form
  - name: watermark_layout
    type: select
    required: false
    default: tile
    options:
      - value: tile
        label:
          en_US: Full Screen Tile
          zh_Hans: 全屏平铺
      - value: center
        label:
          en_US: Center
          zh_Hans: 居中
      - value: corners
        label:
          en_US: Four Corners
          zh_Hans: 四脚分布
      - value: br
        label:
          en_US: Bottom Right Only
          zh_Hans: 仅右下角
      - value: bl
        label:
          en_US: Bottom Left Only
          zh_Hans: 仅左下角
      - value: tr
        label:
          en_US: Top Right Only
          zh_Hans: 仅右上角
      - value: tl
        label:
          en_US: Top Left Only
          zh_Hans: 仅左上角
    label:
      en_US: Watermark Layout
      zh_Hans: 水印布局
    human_description:
      en_US: Layout style of the watermark
      zh_Hans: 水印的布局方式
    form: form
extra:
  python:
    source: tools/mind_map_free_watermark.py

